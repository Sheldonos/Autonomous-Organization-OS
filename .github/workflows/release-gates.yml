name: release-gates
on:
  push:
  pull_request:
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/validate_release.py
      - run: python scripts/smoke_test.py
      - run: python -m pytest -q tests/test_factory.py
      - run: python scripts/audit_package.py
      - run: find . -type d -name __pycache__ -prune -exec rm -rf {} + && find . -type f -name '*.pyc' -delete
